<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img">
<title>State after inotify_add_watch returns</title>
<desc>The inotify instance fd 4 with its watch list now holding one entry, wd 1 mapping to the file. A separate inode box on the right holds a watch-note that points back to fd 4. The event queue and wait queue remain empty.</desc>
<style>
text{font-family:'Inter','Helvetica Neue',Arial,system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
<text class="ts" x="40" y="36" fill="#5F5E5A">inotify_add_watch(fd4, file, IN_MODIFY) returns wd 1</text>
<rect x="40" y="56" width="380" height="294" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="64" y="84" fill="#3C3489">inotify instance</text>
<text class="ts" x="64" y="102" fill="#534AB7">fd 4 (anon_inode)</text>
<rect x="64" y="122" width="332" height="92" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="80" y="148" fill="#085041">watch list</text>
<text class="ts" x="80" y="184" fill="#0F6E56">wd 1 &#8594; file's inode &#183; IN_MODIFY</text>
<rect x="64" y="228" width="160" height="104" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="144" y="266" fill="#633806" text-anchor="middle">event queue</text>
<text class="ts" x="144" y="296" fill="#854F0B" text-anchor="middle">(empty)</text>
<rect x="236" y="228" width="160" height="104" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="316" y="266" fill="#712B13" text-anchor="middle">wait queue</text>
<text class="ts" x="316" y="296" fill="#993C1D" text-anchor="middle">(empty)</text>
<rect x="470" y="150" width="170" height="150" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="555" y="178" fill="#444441" text-anchor="middle">file's inode</text>
<text class="ts" x="555" y="196" fill="#5F5E5A" text-anchor="middle">anon_inode_test.txt</text>
<rect x="494" y="216" width="122" height="66" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="555" y="240" fill="#085041" text-anchor="middle">watch-note</text>
<text class="ts" x="555" y="264" fill="#0F6E56" text-anchor="middle">&#8594; fd 4, wd 1</text>
<text class="ts" x="455" y="335" fill="#5F5E5A" text-anchor="middle">points back</text>
<path d="M524 282 L524 320 L300 320 L300 218" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
