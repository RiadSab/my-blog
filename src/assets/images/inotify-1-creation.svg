<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380" role="img">
<title>The inotify instance at creation, holding three empty lists</title>
<desc>A large container labeled inotify instance fd 4, containing three empty regions side by side: watch list, event queue, and wait queue. All three are empty because inotify_init1 has only just returned.</desc>
<style>
text{font-family:'Inter','Helvetica Neue',Arial,system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>
<text class="ts" x="40" y="40" fill="#5F5E5A">inotify_init1(IN_NONBLOCK)</text>
<line x1="180" y1="60" x2="180" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="92" width="600" height="248" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="64" y="120" fill="#3C3489">inotify instance</text>
<text class="ts" x="64" y="138" fill="#534AB7">fd 4 (anon_inode)</text>
<rect x="64" y="158" width="178" height="158" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="153" y="186" fill="#085041" text-anchor="middle">watch list</text>
<text class="ts" x="153" y="204" fill="#0F6E56" text-anchor="middle">which files watched</text>
<text class="ts" x="153" y="250" fill="#0F6E56" text-anchor="middle">(empty)</text>
<rect x="252" y="158" width="178" height="158" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="341" y="186" fill="#633806" text-anchor="middle">event queue</text>
<text class="ts" x="341" y="204" fill="#854F0B" text-anchor="middle">things that happened</text>
<text class="ts" x="341" y="250" fill="#854F0B" text-anchor="middle">(empty)</text>
<rect x="440" y="158" width="178" height="158" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="529" y="186" fill="#712B13" text-anchor="middle">wait queue</text>
<text class="ts" x="529" y="204" fill="#993C1D" text-anchor="middle">who is asleep on it</text>
<text class="ts" x="529" y="250" fill="#993C1D" text-anchor="middle">(empty)</text>
</svg>
