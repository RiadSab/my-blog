<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" width="560" role="img" aria-label="Ten Feistel rounds stacked, showing the crossover between halves at each round">
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 11.5px; }
  .i rect, .i circle { fill: #eef0ff; stroke: #7c6ce8; stroke-width: 1.5; }
  .i .h { fill: #5647c9; }  .i .s { fill: #8b83d4; }
  .t rect, .t circle { fill: #e7f6f1; stroke: #3aa885; stroke-width: 1.5; }
  .t .h { fill: #1f7a5c; }  .t .s { fill: #57a68c; }
  .a rect, .a circle { fill: #fbeed9; stroke: #d09a3c; stroke-width: 1.5; }
  .a .h { fill: #8f6a24; }  .a .s { fill: #b08c4d; }
  .cap { font-size: 12px; fill: #6a6a8a; }
  .note { font-size: 11.5px; fill: #8b83d4; }
  .wire { stroke: #6b6b7d; stroke-width: 1.5; fill: none; }
  .ghost { stroke: #a8a8bd; stroke-width: 1.5; fill: none; stroke-dasharray: 4 5; }
  .head { fill: #6b6b7d; }
  .dot { fill: #6b6b7d; stroke: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0 0 L10 5 L0 10 z"/>
  </marker>
</defs>

<g class="i">
  <rect x="70" y="14" width="160" height="36" rx="10"/>
  <text class="h" x="150" y="32" text-anchor="middle" dominant-baseline="middle">A = X[0 &#8230; u)</text>
</g>
<g class="i">
  <rect x="330" y="14" width="160" height="36" rx="10"/>
  <text class="h" x="410" y="32" text-anchor="middle" dominant-baseline="middle">B = X[u &#8230; n)</text>
</g>
<line class="wire" x1="150" y1="50" x2="150" y2="70"/>
<line class="wire" x1="410" y1="50" x2="410" y2="70"/>

<text class="cap" x="16" y="96" dominant-baseline="middle">i = 0</text>
<g class="t"><rect x="235" y="80" width="100" height="32" rx="8"/><text class="h" x="285" y="96" text-anchor="middle" dominant-baseline="middle">F(B, 0)</text></g>
<line class="wire" x1="410" y1="70" x2="410" y2="128"/>
<circle class="dot" cx="410" cy="96" r="3.5"/>
<line class="wire" x1="410" y1="96" x2="341" y2="96" marker-end="url(#a)"/>
<line class="wire" x1="235" y1="96" x2="170" y2="96" marker-end="url(#a)"/>
<line class="wire" x1="150" y1="70" x2="150" y2="82"/>
<g class="a"><circle cx="150" cy="96" r="14"/><text class="h" x="150" y="96" text-anchor="middle" dominant-baseline="middle">+</text></g>
<line class="wire" x1="150" y1="110" x2="150" y2="128"/>
<line class="wire" x1="150" y1="128" x2="410" y2="170"/>
<line class="wire" x1="410" y1="128" x2="150" y2="170"/>

<text class="cap" x="16" y="196" dominant-baseline="middle">i = 1</text>
<g class="t"><rect x="235" y="180" width="100" height="32" rx="8"/><text class="h" x="285" y="196" text-anchor="middle" dominant-baseline="middle">F(B, 1)</text></g>
<line class="wire" x1="410" y1="170" x2="410" y2="228"/>
<circle class="dot" cx="410" cy="196" r="3.5"/>
<line class="wire" x1="410" y1="196" x2="341" y2="196" marker-end="url(#a)"/>
<line class="wire" x1="235" y1="196" x2="170" y2="196" marker-end="url(#a)"/>
<line class="wire" x1="150" y1="170" x2="150" y2="182"/>
<g class="a"><circle cx="150" cy="196" r="14"/><text class="h" x="150" y="196" text-anchor="middle" dominant-baseline="middle">+</text></g>
<line class="wire" x1="150" y1="210" x2="150" y2="228"/>
<line class="wire" x1="150" y1="228" x2="410" y2="270"/>
<line class="wire" x1="410" y1="228" x2="150" y2="270"/>

<text class="cap" x="16" y="296" dominant-baseline="middle">i = 2</text>
<g class="t"><rect x="235" y="280" width="100" height="32" rx="8"/><text class="h" x="285" y="296" text-anchor="middle" dominant-baseline="middle">F(B, 2)</text></g>
<line class="wire" x1="410" y1="270" x2="410" y2="328"/>
<circle class="dot" cx="410" cy="296" r="3.5"/>
<line class="wire" x1="410" y1="296" x2="341" y2="296" marker-end="url(#a)"/>
<line class="wire" x1="235" y1="296" x2="170" y2="296" marker-end="url(#a)"/>
<line class="wire" x1="150" y1="270" x2="150" y2="282"/>
<g class="a"><circle cx="150" cy="296" r="14"/><text class="h" x="150" y="296" text-anchor="middle" dominant-baseline="middle">+</text></g>
<line class="wire" x1="150" y1="310" x2="150" y2="328"/>
<line class="wire" x1="150" y1="328" x2="410" y2="370"/>
<line class="wire" x1="410" y1="328" x2="150" y2="370"/>

<text class="cap" x="16" y="392" dominant-baseline="middle">i = 3 &#8230; 8</text>
<line class="ghost" x1="150" y1="370" x2="150" y2="410"/>
<line class="ghost" x1="410" y1="370" x2="410" y2="410"/>
<text class="note" x="285" y="392" text-anchor="middle" dominant-baseline="middle">six more rounds, same wiring</text>

<text class="cap" x="16" y="436" dominant-baseline="middle">i = 9</text>
<g class="t"><rect x="235" y="420" width="100" height="32" rx="8"/><text class="h" x="285" y="436" text-anchor="middle" dominant-baseline="middle">F(B, 9)</text></g>
<line class="wire" x1="410" y1="410" x2="410" y2="468"/>
<circle class="dot" cx="410" cy="436" r="3.5"/>
<line class="wire" x1="410" y1="436" x2="341" y2="436" marker-end="url(#a)"/>
<line class="wire" x1="235" y1="436" x2="170" y2="436" marker-end="url(#a)"/>
<line class="wire" x1="150" y1="410" x2="150" y2="422"/>
<g class="a"><circle cx="150" cy="436" r="14"/><text class="h" x="150" y="436" text-anchor="middle" dominant-baseline="middle">+</text></g>
<line class="wire" x1="150" y1="450" x2="150" y2="468"/>
<line class="wire" x1="150" y1="468" x2="410" y2="510"/>
<line class="wire" x1="410" y1="468" x2="150" y2="510"/>

<path class="wire" d="M150 510 L280 528 M410 510 L280 528"/>
<g class="i">
  <rect x="160" y="530" width="240" height="40" rx="10"/>
  <text class="h" x="280" y="550" text-anchor="middle" dominant-baseline="middle">ciphertext = A &#8214; B</text>
</g>
</svg>
