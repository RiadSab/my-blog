<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650" width="700" role="img" aria-label="Pipeline: production database flows through the pseudonymization service into a test database">
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .h { font-size: 14px; font-weight: 600; }
  .s { font-size: 11.5px; }
  .i rect, .i circle { fill: #eef0ff; stroke: #7c6ce8; stroke-width: 1.5; }
  .i .h { fill: #5647c9; }  .i .s { fill: #8b83d4; }
  .t rect, .t circle { fill: #e7f6f1; stroke: #3aa885; stroke-width: 1.5; }
  .t .h { fill: #1f7a5c; }  .t .s { fill: #57a68c; }
  .a rect, .a circle { fill: #fbeed9; stroke: #d09a3c; stroke-width: 1.5; }
  .a .h { fill: #8f6a24; }  .a .s { fill: #b08c4d; }
  .r rect, .r circle { fill: #fceeee; stroke: #d97a7a; stroke-width: 1.5; }
  .r .h { fill: #a94442; }  .r .s { fill: #c08886; }
  .g rect, .g circle { fill: #f4f4f6; stroke: #9aa0a6; stroke-width: 1.5; }
  .g .h { fill: #4b5057; }  .g .s { fill: #80868b; }
  .cap { font-size: 12px; fill: #6a6a8a; }
  .grp { fill: none; stroke: #c9c9e0; stroke-width: 1.5; stroke-dasharray: 5 5; }
  .wire { stroke: #6b6b7d; stroke-width: 1.5; fill: none; }
  .head { fill: #6b6b7d; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="head" d="M0 0 L10 5 L0 10 z"/>
  </marker>
</defs>

<g class="g">
  <rect x="180" y="20" width="340" height="60" rx="10"/>
  <text class="h" x="350" y="44" text-anchor="middle" dominant-baseline="middle">Production database</text>
  <text class="s" x="350" y="64" text-anchor="middle" dominant-baseline="middle">subscribers, cdr &#183; real MSISDN, CIN, city, name</text>
</g>

<line class="wire" x1="350" y1="80" x2="350" y2="106" marker-end="url(#a)"/>

<rect class="grp" x="40" y="112" width="620" height="418" rx="14"/>
<text class="cap" x="56" y="134">pseudonymization service (Spring Batch)</text>

<g class="g">
  <rect x="230" y="150" width="240" height="48" rx="10"/>
  <text class="h" x="350" y="174" text-anchor="middle" dominant-baseline="middle">ItemReader</text>
</g>
<line class="wire" x1="350" y1="198" x2="350" y2="214" marker-end="url(#a)"/>

<g class="i">
  <rect x="170" y="218" width="360" height="60" rx="10"/>
  <text class="h" x="350" y="242" text-anchor="middle" dominant-baseline="middle">FieldConfig registry</text>
  <text class="s" x="350" y="262" text-anchor="middle" dominant-baseline="middle">column name resolves to a field type, not a table column</text>
</g>
<line class="wire" x1="350" y1="278" x2="350" y2="294" marker-end="url(#a)"/>

<g class="r">
  <rect x="170" y="298" width="360" height="48" rx="10"/>
  <text class="h" x="350" y="322" text-anchor="middle" dominant-baseline="middle">master key &#8594; HKDF &#8594; one key per field type</text>
</g>

<path class="wire" d="M350 346 L350 356 M205 356 L495 356"/>
<line class="wire" x1="205" y1="356" x2="205" y2="362" marker-end="url(#a)"/>
<line class="wire" x1="495" y1="356" x2="495" y2="362" marker-end="url(#a)"/>

<g class="t">
  <rect x="80" y="366" width="250" height="72" rx="10"/>
  <text class="h" x="205" y="388" text-anchor="middle" dominant-baseline="middle">FF1</text>
  <text class="s" x="205" y="408" text-anchor="middle" dominant-baseline="middle">msisdn, cin</text>
  <text class="s" x="205" y="425" text-anchor="middle" dominant-baseline="middle">bijective, format-preserving</text>
</g>

<g class="a">
  <rect x="370" y="366" width="250" height="72" rx="10"/>
  <text class="h" x="495" y="388" text-anchor="middle" dominant-baseline="middle">HMAC dictionary</text>
  <text class="s" x="495" y="408" text-anchor="middle" dominant-baseline="middle">city, first_name, plan</text>
  <text class="s" x="495" y="425" text-anchor="middle" dominant-baseline="middle">not bijective, collides</text>
</g>

<path class="wire" d="M205 438 L205 448 M495 438 L495 448 M205 448 L495 448"/>
<line class="wire" x1="350" y1="448" x2="350" y2="454" marker-end="url(#a)"/>

<g class="g">
  <rect x="230" y="458" width="240" height="48" rx="10"/>
  <text class="h" x="350" y="482" text-anchor="middle" dominant-baseline="middle">ItemWriter</text>
</g>

<line class="wire" x1="350" y1="530" x2="350" y2="556" marker-end="url(#a)"/>

<g class="i">
  <rect x="180" y="560" width="340" height="64" rx="10"/>
  <text class="h" x="350" y="584" text-anchor="middle" dominant-baseline="middle">Test database</text>
  <text class="s" x="350" y="604" text-anchor="middle" dominant-baseline="middle">subscribers_pseudo, cdr_pseudo &#183; joins intact</text>
</g>
</svg>
