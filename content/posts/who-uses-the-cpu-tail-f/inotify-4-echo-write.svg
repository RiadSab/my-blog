<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img">
<title>State when echo writes: event queued and tail woken</title>
<desc>Echo's write enters the kernel, which reads the watch-note on the file's inode, drops an IN_MODIFY event into fd 4's event queue, then walks the wait queue and flips tail from blocked to ready. All three lists in the inotify instance are now in play.</desc>
<style>
text{font-family:'Inter','Helvetica Neue',Arial,system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
<text class="ts" x="40" y="34" fill="#5F5E5A">echo: write(file, "something\n") &#8212; kernel queues event, then wakes tail</text>
<rect x="40" y="50" width="150" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="th" x="115" y="74" fill="#27500A" text-anchor="middle">echo write</text>
<text class="ts" x="115" y="90" fill="#3B6D11" text-anchor="middle">appends bytes</text>
<rect x="470" y="50" width="170" height="92" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="555" y="78" fill="#444441" text-anchor="middle">file's inode</text>
<text class="ts" x="555" y="108" fill="#5F5E5A" text-anchor="middle">watch-note</text>
<text class="ts" x="555" y="126" fill="#5F5E5A" text-anchor="middle">&#8594; fd 4, wd 1</text>
<text class="ts" x="330" y="68" fill="#5F5E5A" text-anchor="middle">1. reads note</text>
<line x1="192" y1="74" x2="466" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="170" width="600" height="244" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="64" y="198" fill="#3C3489">inotify instance</text>
<text class="ts" x="64" y="216" fill="#534AB7">fd 4 (anon_inode)</text>
<rect x="64" y="236" width="178" height="158" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="153" y="264" fill="#085041" text-anchor="middle">watch list</text>
<text class="ts" x="153" y="300" fill="#0F6E56" text-anchor="middle">wd 1 &#8594; file</text>
<text class="ts" x="153" y="320" fill="#0F6E56" text-anchor="middle">IN_MODIFY</text>
<rect x="252" y="236" width="178" height="158" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="341" y="264" fill="#633806" text-anchor="middle">event queue</text>
<text class="ts" x="341" y="312" fill="#854F0B" text-anchor="middle">[wd 1, IN_MODIFY]</text>
<rect x="440" y="236" width="178" height="158" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="529" y="264" fill="#712B13" text-anchor="middle">wait queue</text>
<text class="ts" x="529" y="300" fill="#993C1D" text-anchor="middle">tail</text>
<text class="ts" x="529" y="320" fill="#993C1D" text-anchor="middle">blocked &#8594; READY</text>
<text class="ts" x="555" y="166" fill="#5F5E5A" text-anchor="middle">2. drop event</text>
<path d="M555 142 L555 158 L341 158 L341 234" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="385" y="430" fill="#5F5E5A" text-anchor="middle">3. walk queue, wake tail</text>
<line x1="341" y1="394" x2="488" y2="394" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
