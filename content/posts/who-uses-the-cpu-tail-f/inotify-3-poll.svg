<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 400" role="img">
<title>State after tail calls poll</title>
<desc>The inotify instance fd 4. The watch list still holds wd 1. The wait queue now holds the tail process, marked asleep at zero percent CPU. The event queue is still empty because no write has happened yet.</desc>
<style>
text{font-family:'Inter','Helvetica Neue',Arial,system-ui,sans-serif}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
<text class="ts" x="40" y="36" fill="#5F5E5A">poll([{fd=4, POLLIN}], 1, -1) &#8212; registers tail, then sleeps</text>
<rect x="40" y="56" width="600" height="248" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="64" y="84" fill="#3C3489">inotify instance</text>
<text class="ts" x="64" y="102" fill="#534AB7">fd 4 (anon_inode)</text>
<rect x="64" y="122" width="178" height="158" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="153" y="150" fill="#085041" text-anchor="middle">watch list</text>
<text class="ts" x="153" y="180" fill="#0F6E56" text-anchor="middle">wd 1 &#8594; file</text>
<text class="ts" x="153" y="214" fill="#0F6E56" text-anchor="middle">IN_MODIFY</text>
<rect x="252" y="122" width="178" height="158" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="th" x="341" y="150" fill="#633806" text-anchor="middle">event queue</text>
<text class="ts" x="341" y="200" fill="#854F0B" text-anchor="middle">(empty)</text>
<rect x="440" y="122" width="178" height="158" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="529" y="150" fill="#712B13" text-anchor="middle">wait queue</text>
<text class="ts" x="529" y="186" fill="#993C1D" text-anchor="middle">tail</text>
<text class="ts" x="529" y="206" fill="#993C1D" text-anchor="middle">wake on activity</text>
<line x1="529" y1="300" x2="529" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="404" y="332" width="250" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="529" y="360" fill="#444441" text-anchor="middle">tail asleep &#183; off scheduler &#183; 0% CPU</text>
</svg>
